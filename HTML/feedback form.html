<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>
    <form action="/submit-feedback" method="get" >
        <h1>Feedback Form</h1>
        <div>
            <label for="fname"> Name:</label>
            <input type="text" id="fname" name="fname" placeholder="Write your Name"/>
            <br/> <br/>
            <label for="email"> Email:</label>
            <input type="email" id="email" name="email" placeholder="write your email"/>
        </div>
        <br/>
        <label for="msg"> Message:</label>
        <div>
             <textarea id="msg" name="msg"> </textarea>
            </div>
            <br/>
        <div>
            <label for="rate"> Rate of us out of 5:</label>
            <br/>
            <input type="radio" id="rate1" name="rate" value="1"/>
            <label for="rate"> 1</label>
            <br/>
            <input type="radio" id="rate2" name="rate" value="2"/>
            <label for="rate"> 2</label>
            <br/>
            <input type="radio" id="rate3" name="rate" value="3"/>
            <label for="rate"> 3</label>
            <br/>
            <input type="radio" id="rate4 " name="rate" value="4"/>
            <label for="rate"> 4</label>
            <br/>
            <input type="radio" id="rate5" name="rate" value="5"/>
            <label for="rate"> 5</label>
            </div><br/> <br/>
            <button type="submit">Send your Message !! </button>
        </form>
</body>
</html>
