<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback Form</title>
</head>
<body>

    <h2>Feedback Form</h2>
    <p>We value your feedback</p>

    <form action="/submit-feedback" method="get">

        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label>Rate Us:</label><br>
        <input type="radio" name="rating" value="1"> 1 Star<br>
        <input type="radio" name="rating" value="2"> 2 Stars<br>
        <input type="radio" name="rating" value="3"> 3 Stars<br>
        <input type="radio" name="rating" value="4"> 4 Stars<br>
        <input type="radio" name="rating" value="5"> 5 Stars<br><br>

        <label for="feedback">Your Feedback:</label><br>
        <textarea id="feedback" name="feedback" rows="5" cols="30"></textarea><br><br>

        <input type="submit" value="Submit Feedback">

    </form>

</body>
</html>
